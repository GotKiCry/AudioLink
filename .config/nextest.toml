# cargo-nextest 配置。存在的理由：CI 上 4 核并发跑 26 个测试二进制，其中若干是真实 QUIC/tokio 的
# 端到端用例，等待时间会被并发拉长 —— 给足余量，别把并发变成 flaky。

[profile.default]
# 单个测试超过 60 s 开始告警，连续 3 个周期仍不收敛就判失败（默认无超时，挂住会一直占着）
slow-timeout = { period = "60s", terminate-after = 3 }
# 失败不早停：CI 排错时要看到全部失败面，而不是第一个就收摊
fail-fast = false

# 延迟护栏会把自己量到的 P50/P95/P99 与配对帧数打到 stdout。nextest 默认**捕获成功测试的输出**，
# 也就是说「CI 日志里能读到那个数字」这件事默认不成立 —— 只失败时才可见，等于平时看不到趋势。
# 精确到这一个测试：全量放开会让几百个测试的输出把日志淹掉。
[[profile.default.overrides]]
filter = 'test(latency_budget)'
success-output = "final"

# B 线回归护栏（tests/engine/queue_reject_burst.rs）：30 s 真实 QUIC + 批式中继的实时实验。
# 并发机上的短暂 CPU 饥荒能把播放节拍/会话任务拖出实时性（A 线尖峰、插座攒出超大批次），
# 那是宿主噪声不是被测机制 —— 实时实验需要独占整机：threads-required=max 让 nextest
# 不给它并排调度其它测试；retries 再挡一次残余抖动。机制真坏了时两次都会红。
# 输出常驻可见：A/B/C 三分量与水位分布是这个实验的趋势读数（同 latency_budget 的先例）。
[[profile.default.overrides]]
filter = 'test(queue_rejects_under_wifi_style_bursts)'
threads-required = "num-cpus"
retries = 1
success-output = "final"
