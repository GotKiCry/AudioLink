<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AudioLink</title>
    <script>
      // 主题偏好属于纯前端偏好，存 localStorage（不惊动内核设置文件）。
      // 首帧之前就定下 data-theme，避免亮底闪一下再变黑。
      (function () {
        try {
          var mode = localStorage.getItem("audiolink.theme");
          if (mode === "light" || mode === "dark") {
            document.documentElement.setAttribute("data-theme", mode);
          }
        } catch (e) {
          /* 无 localStorage 时跟随系统即可 */
        }
      })();
    </script>
  </head>
  <body>
    <!--
      本文件不声明设计语言：外观的唯一语言是 Microsoft Fluent 2（Windows 11 口径），
      落地处 = src/index.css 头部注释，规范 = docs/design/fluent-2.md，视觉基准 = docs/design/preview/fluent.html。
      这里原先冻结过一份「播出调音台 / On-Air Console」契约（阳极氧化铝面板、圆角 2–3px、没有玻璃），
      它与交付的实现（五层玻璃 + Mica）相反，2026-09-23 已移除 —— 不要再把它当依据，勿复活。
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
