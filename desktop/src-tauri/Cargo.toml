[package]
name = "audiolink-desktop"
description = "AudioLink 桌面端外壳（托盘 / 自启 / 单实例 / 自动更新 / 内核 IPC）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "audiolink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-store = "2.4"
tauri-plugin-log = "2.9"
tauri-plugin-window-state = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.4"

# 内核 crate：外壳通过 engine 的公开 API（`core/crates/audiolink-engine/src/runtime.rs`）接线，
# 唯一接缝在 src/engine_bridge.rs；`audiolink-audio` 只用于提供 WASAPI 采集/播放工厂
# （`CaptureSource` / `PlayoutSink` 是 `!Send`，只能交出"怎么建"，由音频线程自己建）。
audiolink-engine = { workspace = true }
audiolink-audio = { workspace = true }
# 内核类型：错误码 / NodeId / StreamStats。
audiolink-types = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 「篡改过的更新包必须被验签拒绝」的自动化证据（tests/updater_signature.rs）。
# 与 tauri-plugin-updater 2.11.0 同源的验签实现：该插件的 Cargo.toml 同样依赖
# minisign-verify = "0.2" 与 base64 = "0.22"；这里只用于测试，不进产品依赖、不改产品代码。
minisign-verify = "0.2"
base64 = "0.22"

[lints]
workspace = true
