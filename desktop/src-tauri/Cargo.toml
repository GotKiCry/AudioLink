[package]
name = "audiolink-desktop"
description = "AudioLink 桌面端外壳（托盘 / 自启 / 单实例 / 自动更新 / 内核 IPC）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "audiolink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-store = "2.4"
tauri-plugin-log = "2.9"
tauri-plugin-window-state = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.4"

audiolink-engine = { workspace = true }
audiolink-ffi = { workspace = true }
audiolink-types = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
