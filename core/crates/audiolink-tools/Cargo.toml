# audiolink-tools —— 开发工具：alp2-dump / latency-probe / soak-runner
# 规格见 docs/02-architecture.md、docs/03-protocol.md
[package]
name = "audiolink-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
audiolink-proto = { workspace = true }
audiolink-types = { workspace = true }
audiolink-audio = { workspace = true }   # self-loop：真实 采集/编码/解码/播放 链路
audiolink-engine = { workspace = true }  # link-loop：两个真实 Engine 之间的端到端验收
# device-link：独立测量连接走生产 mTLS 端点（不裸拼 quinn），身份材料从 identity 读
audiolink-net = { workspace = true }
audiolink-identity = { workspace = true }
# latency-probe：QUIC 数据报 + 四时间戳时钟探测（docs/03-protocol.md §6）
anyhow = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
serde_json = { workspace = true }         # self-loop 报告导出（仅工具面；音频/控制面一律 postcard）
tempfile = { workspace = true }           # link-loop：两台节点的临时身份目录

[lints]
workspace = true

[[bin]]
name = "alp2-dump"
path = "src/bin/alp2_dump.rs"

[[bin]]
name = "latency-probe"
path = "src/bin/latency_probe.rs"

# 桌面自环链路 + 四段延迟分解（M1 P0；仅 Windows 可用，非 Windows 为占位 main）
[[bin]]
name = "self-loop"
path = "src/bin/self_loop.rs"

# PC↔PC 真 QUIC 端到端验收（M1 验收主工具：两个 Engine 实例 + 真实 127.0.0.1 QUIC）
[[bin]]
name = "link-loop"
path = "src/bin/link_loop.rs"

# PC → 真机（Android）验收：连接 / PIN 配对 / 推流 / 跨机延迟账本 + JSON（支持 --self-test）
[[bin]]
name = "device-link"
path = "src/bin/device_link.rs"
