name: Release

# 发布流程（M5）：把「能构建」变成「能发给别人」。
#
# 触发：
#   - `push v*.*.*` tag：构建 + 创建 **草稿** Release（`draft: true` —— 发布是对外动作，留一道人工确认）；
#   - `workflow_dispatch`：默认只构建并上传 artifact（`publish=false`），用于**验证发布链路本身**。
#
# 2026-09-16 修正（这份 workflow 从仓库骨架一直活到现在，却从未真正跑过 —— 因为从没打过 tag）：
#   1. **产物路径错了**：写的是 `desktop/src-tauri/target/...`，而本仓库 `.cargo/config.toml` 把 target
#      固定成 `x86_64-pc-windows-msvc`，产物在**仓库根** `target/x86_64-pc-windows-msvc/release/`。
#      原样跑下去，收集步骤必然空手而归 —— 而 `-ErrorAction SilentlyContinue` 会把这件事吞掉。
#   2. **缺打包前置**：桌面安装包要带第三方声明（`bundle.resources` 收了它），没先生成就打不出包。
#   3. **缺更新清单**：`tauri build` 只出「安装包 + .sig」，updater 要的 `latest.json` 没人生成 ——
#      自动更新于是永远停在「配置在、功能不可用」。
#   4. **缺密钥时的行为**：没有签名密钥时 `createUpdaterArtifacts` 会让构建直接失败；现在降级构建
#      并打 `::warning::`，宁可明确说「这份产物不能用于自动更新」。
#
# 2026-09-20 精简（本文件成为仓库唯一 workflow）：`.github/workflows/ci.yml` **整份移除**，流水线只保留打包。
#   * 移除的是测试：core-light / core-heavy（fmt + clippy + nextest）与 soak-gate（弱网 120 s 长跑）
#     一律回本地跑 —— 门禁清单见 CONTRIBUTING.md，它们是开发者的责任，不该占 runner 时间。
#   * 唯一留下的校验是 version-consistency → 下面的 `verify` job：它不是测试，是发布前提
#     （三处版本号必须同源）。
#   * ci.yml 的 android debug APK 打包也一并移除：debug 包不是发布物，它的作用是「验证能构建」，
#     这件事本地就能做。
#   * 本文件的产物校验（清单同源 check-update.mjs、真插件 updater 端到端）**刻意保留**：它们验的是
#     发布产物本身，且签名私钥只存在于 CI secrets —— 本地无法复现。删掉它的代价是发出一批
#     「装得上、永远更新不了」的包（docs/42 §12）。

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "构建后创建草稿 Release（默认否）"
        type: boolean
        default: false
      version:
        description: "publish=true 时必填：版本号（不带 v 前缀，如 0.1.1）"
        type: string
        default: ""

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ---------- 发布前置：版本单一来源校验（唯一校验类 job）----------
  # 原在 `.github/workflows/ci.yml` 的 version-consistency job —— 日常 CI 已整体移除，这一步以
  # **发布前置**的身份留下：它不是测试，而是「三处版本号必须同源」的发布前提
  # （版本漂了就不该产出安装包，更不该发出去）。
  verify:
    name: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches across Cargo / tauri.conf / build.gradle
        shell: pwsh
        run: ./tools/check-version.ps1

  # ---------- 桌面：NSIS 安装包 + 更新签名 + latest.json ----------
  desktop:
    name: desktop installer
    # 依赖 verify：版本号三处一致才值得打包。
    # 依赖 android job：随包发出去的第三方声明必须含 Android 一栏，而那份清单只有 android job
    # 采得到（它需要 Gradle）。缺了它 license-audit -Notices 会**明确失败** —— 这是刻意的：
    # 宁可流水线红，也不发一份「看起来完整、其实少一栏」的声明（docs/42 §13.1）。
    needs: [verify, android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-licenses
          path: target/evidence/compliance/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      # 打包前置：安装包要带第三方声明。
      - name: Generate third-party notices
        run: pwsh tools/license-audit.ps1 -Notices
      - name: Tauri build
        shell: pwsh
        env:
          # 密钥不在时脚本会降级构建并打 ::warning::（见 tools/tauri-build.ps1 的注释）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh tools/tauri-build.ps1
      - name: Generate update manifest
        shell: pwsh
        run: |
          $sig = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter "*.sig" -ErrorAction SilentlyContinue
          if ($sig) {
            pwsh tools/tauri-latest-json.ps1 -Notes "release $env:GITHUB_REF_NAME"
          } else {
            Write-Host "::warning::没有 .sig（未签名构建），跳过 latest.json"
          }
      # 绿色版（便携包）：同一个 exe 的另一种形态 —— 路线图 M5 交付物 3 要求安装包与绿色版都给。
      - name: Build portable zip
        shell: pwsh
        run: pwsh tools/tauri-portable.ps1

      # 清单与产物**同源**校验：签名对不对只有算一遍才知道。
      # 有清单时才跑 —— 降级构建（无签名）不生成 latest.json，不该因此误伤。
      - name: Verify update manifest against the artifacts
        if: ${{ hashFiles('target/evidence/release/latest.json') != '' }}
        shell: pwsh
        run: node tools/check-update.mjs --dir target/x86_64-pc-windows-msvc/release/bundle/nsis

      # 自动更新端到端：清单生成 → 本地托管 → 真插件 check()/download() 真验签
      # （含「篡改 1 字节必须被拒」与「错公钥必须被拒」两个负例）。
      # 为什么必须在这儿跑：签名密钥是发布时才有的东西 —— 私钥配错、或公钥没跟着换，
      # 只有这一步能当场抓住；否则会产出一批「装得上、永远更新不了」的包（docs/42 §12）。
      - name: Updater end-to-end (local host + real plugin)
        if: ${{ hashFiles('target/evidence/release/latest.json') != '' }}
        shell: pwsh
        run: pwsh tools/updater-local-e2e.ps1

      - name: Collect desktop artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $dir = "target/x86_64-pc-windows-msvc/release/bundle/nsis"
          Copy-Item "$dir/*.exe" out/ -ErrorAction SilentlyContinue
          Copy-Item "$dir/*.sig" out/ -ErrorAction SilentlyContinue
          Copy-Item "target/evidence/release/latest.json" out/ -ErrorAction SilentlyContinue
          Copy-Item "target/evidence/release/portable/*.zip" out/ -ErrorAction SilentlyContinue
          Copy-Item "target/evidence/release/portable/SHA256SUMS.txt" out/ -ErrorAction SilentlyContinue
          $found = Get-ChildItem out -ErrorAction SilentlyContinue
          if (-not $found) { throw "没有收集到任何产物 —— 检查 target 路径是否变了（.cargo/config.toml）" }
          $found | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: audiolink-desktop
          path: out/*
          if-no-files-found: error

  # ---------- Android：双 ABI，keystore 走 secrets（缺则降级 debug 并标注）----------
  android:
    name: android apk
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: cargo install cargo-ndk --locked
      - name: Build Rust core for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o android/app/src/main/jniLibs build -p audiolink-ffi --release
      - name: Assemble APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"
            cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            ./gradlew assembleRelease --no-daemon
          else
            echo "::warning::未配置 Android keystore：本次只出 debug APK（不是发布物）"
            ./gradlew assembleDebug --no-daemon
          fi
      # 第三方声明里的 Android 一栏在这里采集（只有本 job 有 Gradle）。
      # 采集脚本读「依赖树报告 + Gradle 缓存里的 POM」——CI 的缓存在 ~/.gradle（不是本地的 .gradle-home）。
      - name: Dependency tree (release runtime classpath)
        working-directory: android
        run: |
          mkdir -p ../target/evidence/compliance
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
            > ../target/evidence/compliance/android-dependencies.txt
      - name: Collect Android dependency licenses
        run: pwsh tools/android-licenses.ps1 -Cache "$HOME/.gradle/caches/modules-2/files-2.1"
      - uses: actions/upload-artifact@v4
        with:
          name: android-licenses
          path: target/evidence/compliance/android-licenses.json
          if-no-files-found: error
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: audiolink-android
          path: out/*.apk
          if-no-files-found: error

  # ---------- 发布：只在 tag 或显式 publish 时创建**草稿** ----------
  release:
    name: publish release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          # tag 触发时用 tag 名；手动 dispatch 时必须**显式给版本号** ——
          # 默认拿分支名（main）当 tag 会创建一个叫 main 的 Release，那是错的。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "::error::publish=true 时必须填 version（分支名不能当 tag 用）"
              exit 1
            fi
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: List artifacts
        run: find dist -type f | sort
      # draft: true 是刻意的：发布对外，留一道人工确认（也避免半成品被当成正式版）。
      - uses: softprops/action-gh-release@v2      # TODO: pin to SHA
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/**/*
          generate_release_notes: true
          draft: true

# 说明：
#  * 发布前必须跑 tools/check-version.ps1 —— 本 workflow 的 verify job 每次都会先跑
#    （原 ci.yml 的 version-consistency job 已挪到此处的 verify job；日常 CI 不再存在）。
#  * 流水线里不再有 lint / 单元测试 / soak：这些是本地门禁（见 CONTRIBUTING.md）。
#  * 自动更新的端点是 releases/latest/download/latest.json —— 草稿 Release 不在 latest 里，
#    所以「草稿 → 手动发布」这一步同时承担了「对外可见」与「更新可见」两件事。
