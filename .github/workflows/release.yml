name: Release

# 触发：tag v*.*.*（与 workspace version 必须一致，由 version-consistency 校验）
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 工具链 ----------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: cargo install cargo-ndk --locked

      # ---------- 桌面端（NSIS 安装包 + 更新产物）----------
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Tauri build
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # ---------- Android（双 ABI，Secret 签名）----------
      - name: Write keystore properties
        shell: pwsh
        run: |
          $p = "android/keystore.properties"
          @"
          storeFile=${{ github.workspace }}\android\release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          "@ | Set-Content -Path $p -Encoding utf8NoBOM
          [IO.File]::WriteAllBytes("${{ github.workspace }}\android\release.jks",
            [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}"))
      - name: Build Rust core for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o android/app/src/main/jniLibs build -p audiolink-ffi --release
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # ---------- 发布 ----------
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "desktop/src-tauri/target/release/bundle/nsis/*.exe" out/ -ErrorAction SilentlyContinue
          Copy-Item "desktop/src-tauri/target/release/bundle/**/*.sig" out/ -ErrorAction SilentlyContinue
          Copy-Item "desktop/src-tauri/target/release/bundle/**/latest.json" out/ -ErrorAction SilentlyContinue
          Copy-Item "android/app/build/outputs/apk/release/*.apk" out/AudioLink-android.apk -ErrorAction SilentlyContinue
          Get-ChildItem out | Format-Table Name, Length

      - uses: softprops/action-gh-release@v2      # TODO: pin to SHA
        with:
          files: out/*
          generate_release_notes: true
          draft: true

      # 说明：
      #  * 绿色版（便携 exe）与安装包同时产出，便携版不含自动更新（见 docs/02-architecture.md §12 技术债）
      #  * 发布前必须跑 tools/check-version.ps1，保证 Cargo / tauri.conf / build.gradle 三处一致
