name: CI

# 触发：主干与 PR。规则：所有 action 必须 pin 到 commit SHA（旧版用未 pin 的 v3 actions 是反面教材）
on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

# 设计说明（2026-09-11 优化）：
#   四个 job **互不依赖、全部并行** —— 它们的唯一共享物是代码本身，不存在构建产物依赖。
#   早先版本让 android/desktop `needs: rust`，导致总时长 = rust(27min) + max(android, desktop)，
#   首轮实测 49 分钟。现在总时长 ≈ max(各 job) ≈ 22~27 分钟。
#   另外把「内核 lint/test」与「桌面外壳构建」拆开：内核几个 crate 依赖极轻，能在数分钟内给出反馈，
#   不必等 tauri 那一整套依赖编完。

jobs:
  # ---------- 快速反馈：内核格式 / lint / 单元测试（协议 golden vectors 在此把关）----------
  core:
    name: core (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4          # TODO: pin to SHA
      - uses: dtolnay/rust-toolchain@stable # TODO: pin to SHA；实际版本由 rust-toolchain.toml 决定
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2        # TODO: pin to SHA
      - run: cargo fmt --all --check
      # 排除桌面外壳：它的 tauri 依赖编译很重，放到独立的 desktop job 里
      - name: Clippy (kernel crates)
        run: cargo clippy --workspace --exclude audiolink-desktop --all-targets --all-features -- -D warnings
      - name: Test (kernel crates)
        run: cargo test --workspace --exclude audiolink-desktop

  # ---------- Android：Rust 交叉编译 + 组装 debug APK ----------
  android:
    name: android (ndk + assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust core for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o android/app/src/main/jniLibs build -p audiolink-ffi --release
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: audiolink-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # ---------- 桌面端：类型检查 + Tauri 构建（不含签名）----------
  desktop:
    name: desktop (vite + tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Type check & build frontend
        run: pnpm build
        working-directory: desktop
      - name: Cargo check (shell)
        run: cargo check -p audiolink-desktop

  # ---------- 版本一致性：单一来源校验（旧版靠人工同步三处，必错）----------
  version-consistency:
    name: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches across Cargo / tauri.conf / build.gradle
        shell: pwsh
        run: ./tools/check-version.ps1
