name: CI

# 触发：主干与 PR。规则：所有 action 必须 pin 到 commit SHA（旧版用未 pin 的 v3 actions 是反面教材）
on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

# 设计说明（2026-09-11 优化，2026-09-16 再优化）：
#   五个 job **互不依赖、全部并行** —— 它们的唯一共享物是代码本身，不存在构建产物依赖。
#   早先版本让 android/desktop `needs: rust`，导致总时长 = rust(27min) + max(android, desktop)，
#   首轮实测 49 分钟。现在总时长 ≈ max(各 job)，实测 3~4 分钟（依赖树已被 rust-cache 全覆盖）。
#   另外把「内核 lint/test」与「桌面外壳构建」拆开：内核几个 crate 依赖极轻，能在数分钟内给出反馈，
#   不必等 tauri 那一整套依赖编完。
# 2026-09-16：core 本身是墙钟关键路径（实测 236-256 s），再拆成 core-light（types/proto/identity，
#   协议层 golden vectors 的快反馈通道）与 core-heavy（其余内核 crate）。依据与实测见 docs/26。

jobs:
  # ---------- 快速反馈：轻内核（fmt + clippy + test；协议 golden vectors 在此把关）----------
  # 这三个 crate 不依赖 net/engine/audio，编译与链接极轻 —— 协议层的结论不必等重内核编完。
  core-light:
    name: core-light (fmt + proto/identity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4          # TODO: pin to SHA
      - uses: dtolnay/rust-toolchain@stable # TODO: pin to SHA；实际版本由 rust-toolchain.toml 决定
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2        # TODO: pin to SHA
      - run: cargo fmt --all --check
      - name: Clippy (light kernel crates)
        run: cargo clippy -p audiolink-types -p audiolink-proto -p audiolink-identity --all-targets --all-features -- -D warnings
      # --lib --tests：跳过 doctests（内核各 crate 目前 doctest 全为 0 项，只为它们链 rustdoc 不划算）
      - name: Test (light kernel crates)
        run: cargo test -p audiolink-types -p audiolink-proto -p audiolink-identity --lib --tests

  # ---------- 重内核：其余全部内核 crate ----------
  # 用 --workspace --exclude <轻内核三件> 而不是逐个 -p：将来新增 crate 会**自动**落进重 job，
  # 不会悄悄漏测（漏测比慢贵得多）。两个 job 的 crate 并集 = 除桌面外壳外的全部成员，交集为空。
  core-heavy:
    name: core-heavy (audio/net/engine/ffi/tools)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4          # TODO: pin to SHA
      - uses: dtolnay/rust-toolchain@stable # TODO: pin to SHA；实际版本由 rust-toolchain.toml 决定
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2        # TODO: pin to SHA
      # 排除桌面外壳（tauri 依赖重，在 desktop job 里）与已在 core-light 覆盖的三个轻内核
      - name: Clippy (heavy kernel crates)
        run: cargo clippy --workspace --exclude audiolink-desktop --exclude audiolink-types --exclude audiolink-proto --exclude audiolink-identity --all-targets --all-features -- -D warnings
      # 无 #[test] 的 bin 已在各自 Cargo.toml 里标 test = false，不再为它们各链一个测试二进制
      - name: Test (heavy kernel crates)
        run: cargo test --workspace --exclude audiolink-desktop --exclude audiolink-types --exclude audiolink-proto --exclude audiolink-identity --lib --tests

  # ---------- Android：Rust 交叉编译 + 组装 debug APK ----------
  android:
    name: android (ndk + assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      # Gradle 依赖 + wrapper 分发缓存：assembleDebug 是本 job 的关键路径（实测 130 s）
      - uses: actions/cache@v4          # TODO: pin to SHA
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # cargo-ndk 由 Swatinem/rust-cache 的 cache-bin 覆盖，实测这一步只花 1 s（不再重编）
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust core for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o android/app/src/main/jniLibs build -p audiolink-ffi --release
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: audiolink-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # ---------- 桌面端：类型检查 + Tauri 构建（不含签名）----------
  desktop:
    name: desktop (vite + tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Type check & build frontend
        run: pnpm build
        working-directory: desktop
      - name: Cargo check (shell)
        run: cargo check -p audiolink-desktop

  # ---------- 版本一致性：单一来源校验（旧版靠人工同步三处，必错）----------
  version-consistency:
    name: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches across Cargo / tauri.conf / build.gradle
        shell: pwsh
        run: ./tools/check-version.ps1
