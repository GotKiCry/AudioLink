name: CI

# 触发：主干与 PR。规则：所有 action 必须 pin 到 commit SHA（旧版用未 pin 的 v3 actions 是反面教材）
on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

# 设计说明（2026-09-11 优化，2026-09-16 再优化）：
#   五个 job **互不依赖、全部并行** —— 它们的唯一共享物是代码本身，不存在构建产物依赖。
#   早先版本让 android/desktop `needs: rust`，导致总时长 = rust(27min) + max(android, desktop)，
#   首轮实测 49 分钟。现在总时长 ≈ max(各 job)，实测 3~4 分钟（依赖树已被 rust-cache 全覆盖）。
#   另外把「内核 lint/test」与「桌面外壳构建」拆开：内核几个 crate 依赖极轻，能在数分钟内给出反馈，
#   不必等 tauri 那一整套依赖编完。
# 2026-09-16：core 本身是墙钟关键路径（实测 236-256 s），再拆成 core-light（types/proto/identity，
#   协议层 golden vectors 的快反馈通道）与 core-heavy（其余内核 crate）。依据与实测见 docs/26。

jobs:
  # ---------- 快速反馈：轻内核（fmt + clippy + test；协议 golden vectors 在此把关）----------
  # 这三个 crate 不依赖 net/engine/audio，编译与链接极轻 —— 协议层的结论不必等重内核编完。
  core-light:
    name: core-light (fmt + proto/identity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4          # TODO: pin to SHA
      - uses: dtolnay/rust-toolchain@stable # TODO: pin to SHA；实际版本由 rust-toolchain.toml 决定
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2        # TODO: pin to SHA
      - run: cargo fmt --all --check
      - name: Clippy (light kernel crates)
        run: cargo clippy -p audiolink-types -p audiolink-proto -p audiolink-identity --all-targets --all-features -- -D warnings
      # --lib --tests：跳过 doctests（内核各 crate 目前 doctest 全为 0 项，只为它们链 rustdoc 不划算）
      # nextest 走官方预编译包（get.nexte.st）而不是 `cargo install`：后者每次运行都要从源码编译，
      # **实测在 CI 上花 375~404 s**（rust-cache 的 bin 缓存没有把它留住）。预编译包 7.5 MB，
      # 本地实测下载 1.9 s + 解压 0.4 s。版本显式 pin，装完立刻 --version 校验：
      # 装坏了就在这一步红，而不是留到测试步骤去猜。
      - name: Install cargo-nextest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = '0.9.144'
          $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $zip = Join-Path $tmp 'nextest.zip'
          Invoke-WebRequest -Uri "https://get.nexte.st/$version/windows" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:USERPROFILE '.cargo\bin') -Force
          cargo nextest --version
      # nextest 跨测试二进制并行调度（cargo test 是逐个二进制串行）。本地实测：heavy 集 78.2 s → 18.8 s
      # （3/3 次一致，344 项与 cargo test --lib --tests 完全相同，无漏测）。首次安装由 rust-cache 缓存。
      - name: Test (light kernel crates)
        run: cargo nextest run -p audiolink-types -p audiolink-proto -p audiolink-identity --lib --tests

  # ---------- 重内核：其余全部内核 crate ----------
  # 用 --workspace --exclude <轻内核三件> 而不是逐个 -p：将来新增 crate 会**自动**落进重 job，
  # 不会悄悄漏测（漏测比慢贵得多）。两个 job 的 crate 并集 = 除桌面外壳外的全部成员，交集为空。
  core-heavy:
    name: core-heavy (audio/net/engine/ffi/tools)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4          # TODO: pin to SHA
      - uses: dtolnay/rust-toolchain@stable # TODO: pin to SHA；实际版本由 rust-toolchain.toml 决定
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2        # TODO: pin to SHA
      # 排除桌面外壳（tauri 依赖重，在 desktop job 里）与已在 core-light 覆盖的三个轻内核
      - name: Clippy (heavy kernel crates)
        run: cargo clippy --workspace --exclude audiolink-desktop --exclude audiolink-types --exclude audiolink-proto --exclude audiolink-identity --all-targets --all-features -- -D warnings
      # 无 #[test] 的 bin 已在各自 Cargo.toml 里标 test = false，不再为它们各链一个测试二进制
      # nextest 走官方预编译包（get.nexte.st）而不是 `cargo install`：后者每次运行都要从源码编译，
      # **实测在 CI 上花 375~404 s**（rust-cache 的 bin 缓存没有把它留住）。预编译包 7.5 MB，
      # 本地实测下载 1.9 s + 解压 0.4 s。版本显式 pin，装完立刻 --version 校验：
      # 装坏了就在这一步红，而不是留到测试步骤去猜。
      - name: Install cargo-nextest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = '0.9.144'
          $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $zip = Join-Path $tmp 'nextest.zip'
          Invoke-WebRequest -Uri "https://get.nexte.st/$version/windows" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:USERPROFILE '.cargo\bin') -Force
          cargo nextest --version
      - name: Test (heavy kernel crates)
        run: cargo nextest run --workspace --exclude audiolink-desktop --exclude audiolink-types --exclude audiolink-proto --exclude audiolink-identity --lib --tests

  # ---------- 长跑门禁：弱网档（M2 弱网验收的迷你版）----------
  # 跑什么档、为什么是这个档、**严格档为什么不进 CI**：见 `docs/22-m2-soak-runner.md` §14（附实测证据）。
  # 一句话：严格档（late_drop / underrun 全零）量的是「本机调度与回环争用」，在 CI runner 上不可控 ——
  # 接进来等于加一个随机变红的门禁，比没有门禁更糟（团队会开始忽略它）。
  # 这里接的是「弱网档 + 120 s」：入口注入由种子固定（netem seed 1）、判据是
  #「会话不断 + 掩盖帧 ≤ 总帧数 1%」，两者都不随机器负载漂。
  soak-gate:
    name: soak-gate (weak network, 120 s)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4          # TODO: pin to SHA
      - uses: dtolnay/rust-toolchain@stable # TODO: pin to SHA
      - uses: Swatinem/rust-cache@v2        # TODO: pin to SHA
      - name: Build soak-runner
        run: cargo build -p audiolink-tools --bin soak-runner
      # 验收口径的注入参数（docs/22 §12：「30 ms 抖动」= ±15 ms），种子固定 → 注入序列可复现。
      # --max-underrun-pct 0：静音占比**记录但不判** —— 它由 underrun 派生，对机器负载敏感
      # （docs/22 §11.6：同一条命令，机器安静 0.20%、有负载 9.33%），当 CI 门禁会变成随机红。
      - name: Weak-network soak (120 s)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'target/evidence/soak/ci-weak-120s.json'
          cargo run -q -p audiolink-tools --bin soak-runner -- run `
            --seconds 120 `
            --netem-loss-pct 2 --netem-delay-ms 15 --netem-jitter-ms 15 --netem-bandwidth-kbps 5000 `
            --netem-seed 1 `
            --tolerant --max-underrun-pct 0 `
            --report $report
          # 退出码语义：0 = 无异常；1 = 有异常；2 = 用法 / 初始化失败。
          # **两个非零都必须让 job 红** —— 所以先把它存下来（后面的 cmdlet 会把它覆盖成 0），
          # 也不写成「跑完再判断一下」那种把 2 当通过的形式。
          $code = $LASTEXITCODE
          if (-not (Test-Path $report)) {
            Write-Host "::error::soak 报告缺失（$report），退出码 $code"
            if ($code -eq 0) { exit 2 } else { exit $code }
          }
          $summary = (Get-Content $report -Raw | ConvertFrom-Json).summary
          $kinds = ($summary.violations_by_kind.PSObject.Properties |
            Where-Object { $_.Value -gt 0 } |
            ForEach-Object { "$($_.Name)x$($_.Value)" }) -join ', '
          Write-Host ("soak verdict={0} samples={1} violations_total={2} plc={3} 静音占比={4}（×0.01%，只记录不判）" -f
            $summary.verdict, $summary.samples, $summary.violations_total,
            $summary.violations_by_kind.playout_concealment, $summary.underrun_pct_x100)
          Write-Host "violations_by_kind（非零）: $kinds"
          # 有违规先按 1 透传（信息量最大的那个码）；采样兜底只对「判定 ok」生效 ——
          # 判定 ok 而采样少得离谱 = 这一步没真跑，那不是通过。
          if ($code -ne 0) { exit $code }
          if ([int]$summary.samples -lt 100) {
            Write-Host "::error::判定 ok 但采样只有 $($summary.samples) 次（120 s 计划约 117 次），疑似没真跑"
            exit 3
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-ci-weak-120s
          path: target/evidence/soak/ci-weak-120s.json

  # ---------- Android：Rust 交叉编译 + 组装 debug APK ----------
  android:
    name: android (ndk + assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      # Gradle 依赖 + wrapper 分发缓存：assembleDebug 是本 job 的关键路径（实测 130 s）
      - uses: actions/cache@v4          # TODO: pin to SHA
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # cargo-ndk 由 Swatinem/rust-cache 的 cache-bin 覆盖，实测这一步只花 1 s（不再重编）
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust core for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o android/app/src/main/jniLibs build -p audiolink-ffi --release
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: audiolink-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # ---------- 桌面端：类型检查 + Tauri 构建（不含签名）----------
  desktop:
    name: desktop (vite + tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Type check & build frontend
        run: pnpm build
        working-directory: desktop
      # 前端单测（vitest：jsdom + @testing-library/react；配置见 desktop/vitest.config.ts）。
      # 为什么与 build 同一个 job、不新建 job：这个 job 已经有 node/pnpm 与装好的依赖，
      # 新建一个只会多一遍 install 与冷启动（本 job 现有的经验：见文件头的 job 拆分说明）。
      # 测试文件也落在 `tsconfig` 的 include 里，所以上面的 `pnpm build`（tsc --noEmit）会一并做类型检查。
      - name: Test frontend (vitest)
        run: pnpm test
        working-directory: desktop
      - name: Cargo check (shell)
        run: cargo check -p audiolink-desktop
      # M5 合规：依赖许可审计（Rust 全量 + 桌面前端）。
      # 为什么放在这个 job：它同时有 cargo 与 pnpm（两边都能采到），不必再加一个 job。
      # 护栏的意义是「新引入一个不能分发的依赖」在 CI 里就红，而不是等发布前才发现。
      # ⚠️ 这一步**不含 Android**：Gradle 依赖要由 tools/android-licenses.ps1 先采（需要 Gradle 与依赖缓存，
      #    本 job 没有）。缺清单时报告会自己写明「本次不含 Android 一栏」，不再静悄悄跳过 ——
      #    详见 docs/compliance/license-report.md 的「覆盖面（诚实清单）」一节。
      - name: License audit (Rust + frontend; Android 一列见 tools/android-licenses.ps1)
        run: pwsh tools/license-audit.ps1

  # ---------- 版本一致性：单一来源校验（旧版靠人工同步三处，必错）----------
  version-consistency:
    name: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches across Cargo / tauri.conf / build.gradle
        shell: pwsh
        run: ./tools/check-version.ps1
