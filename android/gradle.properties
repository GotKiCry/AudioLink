# AudioLink Android —— Gradle 配置
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle 9 需要 JDK 17+ 才能启动（**launcher** JVM；org.gradle.java.home 只影响 daemon JVM）。
#
# ⚠️ 不要把本机 JDK 路径硬编码在这里 —— CI（Ubuntu runner）会因该路径不存在而直接构建失败。
# 本地开发请用包装脚本（自动校验 JAVA_HOME 是否为 17+）：
#     pwsh tools\gradlew.ps1 assembleDebug
# 或自行把 JAVA_HOME 指向 JDK 17+。

# 本项目不建议复用全局 ~/.gradle（可能含公司私服与明文凭证）：
# 通过环境变量 GRADLE_USER_HOME=C:\_Project\AudioLink\.gradle-home 隔离
