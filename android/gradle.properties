# AudioLink Android —— Gradle 配置
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle 9.x 要求 JVM 17–26；本机全局 JAVA_HOME 指向 JDK 11（会导致 gradlew 直接启动失败）。
# 这里在项目内指定 JDK，避免改动全局环境变量。
org.gradle.java.home=C:/Users/liuzh/scoop/apps/corretto17-jdk/current

# 本项目不建议复用全局 ~/.gradle（可能含公司私服与明文凭证）：
# 通过环境变量 GRADLE_USER_HOME=C:\_Project\AudioLink\.gradle-home 隔离
